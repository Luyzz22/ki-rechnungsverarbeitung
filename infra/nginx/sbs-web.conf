# -----------------------------------------------------------------------------
# Plain HTTP → HTTPS for the marketing hosts only.
# The ACME challenge path stays reachable so certbot can renew.
# -----------------------------------------------------------------------------
server {
    listen 80;
    listen [::]:80;
    server_name sbsdeutschland.com www.sbsdeutschland.com
                industrie.sbsdeutschland.com legal.sbsdeutschland.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}
