# Security headers for the marketing hosts.
# Deliberately conservative: the pages ship no third-party scripts, no inline
# event handlers and no remote fonts, so the policy can stay tight.
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
add_header X-Content-Type-Options    "nosniff" always;
add_header Referrer-Policy           "strict-origin-when-cross-origin" always;
add_header X-Frame-Options           "SAMEORIGIN" always;
add_header Permissions-Policy        "camera=(), microphone=(), geolocation=(), interest-cohort=()" always;

# Next.js emits hashed inline bootstrap scripts and inline critical CSS, so
# 'unsafe-inline' is required for style-src and script-src. Fonts are served
# from the same origin because next/font self-hosts them at build time.
add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self'; frame-ancestors 'self'; base-uri 'self'; form-action 'self'; object-src 'none'" always;

# Immutable build assets.
location /_next/static/ {
    proxy_pass http://sbs_web_upstream;
    proxy_set_header Host $host;
    add_header Cache-Control "public, max-age=31536000, immutable";
}

client_max_body_size 2m;
gzip on;
gzip_types text/plain text/css application/javascript application/json image/svg+xml;
gzip_min_length 1024;
