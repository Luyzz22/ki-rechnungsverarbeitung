# =============================================================================
# SBS Deutschland — Marketing web layer (sbs-web)
#
# Serves three public hostnames from one Next.js process on 127.0.0.1:3100.
# The existing invoice application on app.sbsdeutschland.com (127.0.0.1:8000)
# is NOT touched by this file — it keeps its own server block.
#
# Install with infra/scripts/enable-nginx.sh — it stages, validates, backs up
# and reverts on failure. Do not copy this file into /etc/nginx by hand.
#
# Written for nginx >= 1.25.1 (`http2 on;`). The production host runs 1.26.3.
# enable-nginx.sh rewrites the staged copy to the pre-1.25.1
# `listen ... ssl http2` form when it detects an older nginx, so this file stays
# compatible with both without carrying a deprecated directive.
# =============================================================================

upstream sbs_web_upstream {
    server 127.0.0.1:3100;
    keepalive 32;
}

map $http_upgrade $sbs_connection_upgrade {
    default upgrade;
    ''      close;
}

# Rate limiting state. Sized for a small host: ~160k addresses per megabyte.
limit_req_zone  $binary_remote_addr zone=sbs_web_rps:10m rate=20r/s;
limit_conn_zone $binary_remote_addr zone=sbs_web_conn:10m;

# Do not advertise the nginx version.
server_tokens off;

# -----------------------------------------------------------------------------
# Default server — everything that does not match a known hostname.
#
# Without this, a request carrying an unknown Host (or addressing the server by
# IP) lands on whichever server block nginx happens to parse first, which would
# expose the marketing site's internal URL space. 444 closes the connection
# without a response.
#
# NOTE: only enable this if no other server block already claims default_server
# on these ports. Check with:  nginx -T | grep -n default_server
# -----------------------------------------------------------------------------
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    # Keep certificate renewal reachable even on the catch-all.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 444;
    }
}

# -----------------------------------------------------------------------------
# Corporate — sbsdeutschland.com
# -----------------------------------------------------------------------------
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name sbsdeutschland.com;

    # Certificate paths are managed by certbot; see infra/scripts/issue-certs.sh
    ssl_certificate     /etc/letsencrypt/live/sbsdeutschland.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/sbsdeutschland.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    include snippets/sbs-web-common.conf;
    include snippets/sbs-web-redirects.conf;

    location / {
        include snippets/sbs-web-proxy.conf;
    }
}

# -----------------------------------------------------------------------------
# www — one canonical origin, so the two hostnames never compete in the index.
# -----------------------------------------------------------------------------
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name www.sbsdeutschland.com;

    ssl_certificate     /etc/letsencrypt/live/sbsdeutschland.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/sbsdeutschland.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    include snippets/sbs-web-headers.conf;

    return 301 https://sbsdeutschland.com$request_uri;
}

