# Security headers for the marketing hosts.
#
# nginx does not merge add_header across levels: a location that declares any
# add_header of its own discards every inherited one. This snippet is therefore
# included in the server block AND in every location that adds a header, rather
# than relying on inheritance.
#
# HSTS deliberately omits includeSubDomains. Sibling subdomains of
# sbsdeutschland.com are not all verified — chat.sbsdeutschland.com currently
# serves an expired certificate — and includeSubDomains would pin every one of
# them to HTTPS for a year with no user-side bypass. Re-enable only after every
# subdomain has been confirmed to serve valid TLS.
add_header Strict-Transport-Security "max-age=31536000" always;

add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy        "strict-origin-when-cross-origin" always;
add_header X-Frame-Options        "DENY" always;
add_header Cross-Origin-Opener-Policy   "same-origin" always;
add_header Cross-Origin-Resource-Policy "same-origin" always;
add_header Permissions-Policy "accelerometer=(), autoplay=(), camera=(), display-capture=(), encrypted-media=(), fullscreen=(self), geolocation=(), gyroscope=(), magnetometer=(), microphone=(), midi=(), payment=(), usb=(), interest-cohort=()" always;

# Next.js App Router inlines its bootstrap script and its critical CSS, so
# 'unsafe-inline' is required for script-src and style-src. A nonce-based policy
# would force every page to render per request and give up static rendering.
# The exposure is bounded: the site has no user-generated content, no
# third-party script, no remote font and no inline event handler, and the single
# dangerouslySetInnerHTML (JSON-LD) escapes < > & before serialising.
add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self'; manifest-src 'self'; worker-src 'self'; media-src 'none'; object-src 'none'; frame-src 'none'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; upgrade-insecure-requests" always;
