# Shared proxy directives for the sbs-web upstream.
# The Host header must be preserved: the application selects the site from it.
proxy_pass         http://sbs_web_upstream;
proxy_http_version 1.1;
proxy_set_header   Host              $host;
proxy_set_header   X-Real-IP         $remote_addr;
proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
proxy_set_header   X-Forwarded-Proto $scheme;
proxy_set_header   X-Forwarded-Host  $host;
proxy_set_header   Upgrade           $http_upgrade;
proxy_set_header   Connection        $sbs_connection_upgrade;
proxy_read_timeout 30s;
proxy_buffering    on;

# The application sets its own baseline security headers so that it is still
# safe when run without a reverse proxy. At the edge nginx is authoritative, so
# the upstream copies are stripped first — otherwise every response would carry
# two values for the same header, and X-Frame-Options would be contradictory.
proxy_hide_header X-Frame-Options;
proxy_hide_header X-Content-Type-Options;
proxy_hide_header Referrer-Policy;
proxy_hide_header Permissions-Policy;
proxy_hide_header Content-Security-Policy;
proxy_hide_header Strict-Transport-Security;
