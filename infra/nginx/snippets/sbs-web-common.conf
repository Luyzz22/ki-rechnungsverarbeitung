# Shared behaviour for every SBS marketing host.
include snippets/sbs-web-headers.conf;

# Immutable build assets. Because this location declares an add_header of its
# own, the inherited security headers must be re-included here — see
# sbs-web-headers.conf.
location /_next/static/ {
    include snippets/sbs-web-headers.conf;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    include snippets/sbs-web-proxy.conf;
}

# Fonts self-hosted by next/font carry the same cache profile.
location /_next/media/ {
    include snippets/sbs-web-headers.conf;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    include snippets/sbs-web-proxy.conf;
}

client_max_body_size 1m;
client_body_timeout  10s;
client_header_timeout 10s;

# The host has 1 vCPU and 1.9 GiB of RAM and also runs the invoice application, so a
# burst against the marketing site must not become its problem. The limit is
# generous for human browsing and cheap to raise.
limit_req  zone=sbs_web_rps burst=40 nodelay;
limit_conn sbs_web_conn 24;

gzip on;
gzip_vary on;
gzip_proxied any;
gzip_comp_level 5;
gzip_min_length 1024;
gzip_types
    text/plain
    text/css
    text/xml
    application/xml
    application/xml+rss
    application/xhtml+xml
    application/javascript
    application/x-javascript
    application/json
    application/ld+json
    application/manifest+json
    image/svg+xml;
