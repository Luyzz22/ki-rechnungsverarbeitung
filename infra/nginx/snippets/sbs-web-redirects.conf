# =============================================================================
# Legacy URL migration for sbsdeutschland.com
#
# Every URL that answered 200 on the old site keeps a permanent destination.
# The inventory below was taken from the live site, not from the repository:
# each entry was confirmed reachable before it was mapped, and the two
# catch-alls guarantee that nothing under the old prefixes can 404.
#
# Included only in the corporate server block — the division hosts are new and
# have no legacy URL space.
# =============================================================================

# ---- Corporate pages --------------------------------------------------------
location = /sbshomepage/                      { return 301 https://sbsdeutschland.com/; }
location = /sbshomepage                       { return 301 https://sbsdeutschland.com/; }
location = /sbshomepage/index.html            { return 301 https://sbsdeutschland.com/; }
location = /sbshomepage/unternehmen.html      { return 301 https://sbsdeutschland.com/unternehmen; }
location = /sbshomepage/kontakt.html          { return 301 https://sbsdeutschland.com/kontakt; }
location = /sbshomepage/impressum.html        { return 301 https://sbsdeutschland.com/impressum; }
location = /sbshomepage/datenschutz.html      { return 301 https://sbsdeutschland.com/datenschutz; }
location = /sbshomepage/agb.html              { return 301 https://sbsdeutschland.com/impressum; }

# Consulting pages fold into the company page's consulting section.
location = /sbshomepage/sap-consulting.html            { return 301 https://sbsdeutschland.com/unternehmen#consulting; }
location = /sbshomepage/it-consulting.html             { return 301 https://sbsdeutschland.com/unternehmen#consulting; }
location = /sbshomepage/quality-risk-management.html   { return 301 https://sbsdeutschland.com/unternehmen#consulting; }
location = /sbshomepage/met-pmo.html                   { return 301 https://sbsdeutschland.com/unternehmen#consulting; }

# Catch-all for the corporate prefix.
location ^~ /sbshomepage/ { return 301 https://sbsdeutschland.com/; }

# ---- Product landing pages --------------------------------------------------
# The invoice product keeps its application at app.sbsdeutschland.com; its
# marketing surface is now the FlowCheck AI+ page on the corporate platform.
location = /static/landing/                            { return 301 https://sbsdeutschland.com/plattform/flowcheck; }
location = /static/landing/index.html                  { return 301 https://sbsdeutschland.com/plattform/flowcheck; }
location = /static/landing/preise.html                 { return 301 https://sbsdeutschland.com/plattform/flowcheck; }
location = /static/landing/integrationen.html          { return 301 https://sbsdeutschland.com/plattform/flowcheck; }
location = /static/landing/loesungen.html              { return 301 https://sbsdeutschland.com/plattform/flowcheck; }
location = /static/landing/loesungen-finanzleitung.html      { return 301 https://sbsdeutschland.com/plattform/flowcheck; }
location = /static/landing/loesungen-steuerberater.html      { return 301 https://sbsdeutschland.com/plattform/flowcheck; }
location = /static/landing/loesungen-handel-filialnetz.html  { return 301 https://sbsdeutschland.com/plattform/flowcheck; }
location = /static/landing/support.html                { return 301 https://sbsdeutschland.com/kontakt; }
location = /static/landing/ressourcen.html             { return 301 https://sbsdeutschland.com/ressourcen; }

# Customer and reference pages have no successor: the new site carries no
# customer evidence, because none is approved for publication.
location = /static/landing/kunden.html                 { return 301 https://sbsdeutschland.com/unternehmen; }
location = /static/landing/referenzen.html             { return 301 https://sbsdeutschland.com/unternehmen; }

# HydraulikDoc marketing pages move to the industry division. Service Knowledge
# OS is the earlier name of the same product line, so it lands there too.
location = /static/landing/hydraulikdoc.html            { return 301 https://industrie.sbsdeutschland.com/produkte/hydraulikdoc; }
location = /static/landing/hydraulikdoc-enterprise.html { return 301 https://industrie.sbsdeutschland.com/produkte/hydraulikdoc#architektur; }
location = /static/landing/hydraulikdoc-docs.html       { return 301 https://industrie.sbsdeutschland.com/produkte/hydraulikdoc; }
location = /static/landing/hydraulikdoc-partners.html   { return 301 https://industrie.sbsdeutschland.com/produkte/hydraulikdoc; }
location = /static/landing/service-knowledge-os.html    { return 301 https://industrie.sbsdeutschland.com/produkte/hydraulikdoc; }

# Trust and compliance surfaces.
location = /static/landing/security.html      { return 301 https://sbsdeutschland.com/sicherheit; }
location = /static/landing/compliance.html    { return 301 https://sbsdeutschland.com/sicherheit; }
location = /static/landing/avv.html           { return 301 https://sbsdeutschland.com/sicherheit; }
location = /static/landing/impressum.html     { return 301 https://sbsdeutschland.com/impressum; }
location = /static/landing/datenschutz.html   { return 301 https://sbsdeutschland.com/datenschutz; }
location = /static/landing/agb.html           { return 301 https://sbsdeutschland.com/impressum; }
location = /static/landing/api.html           { return 301 https://app.sbsdeutschland.com/docs; }

# Catch-all for the landing prefix: anything not named above still lands on the
# product page rather than on a 404.
location ^~ /static/landing/ { return 301 https://sbsdeutschland.com/plattform/flowcheck; }

# ---- Legacy top-level entry points ------------------------------------------
# All three answered 200 (or redirected to a 200) on the old site.
location ^~ /landing    { return 301 https://sbsdeutschland.com/plattform/flowcheck; }
location ^~ /preise     { return 301 https://sbsdeutschland.com/plattform/flowcheck; }
location ^~ /static/preise/ { return 301 https://sbsdeutschland.com/plattform/flowcheck; }

# Contract analysis moves to the legal division. The more specific prefix must
# come first: nginx picks the longest matching ^~ prefix, so /loesungen alone
# would otherwise swallow it.
location ^~ /loesungen/vertragsanalyse { return 301 https://legal.sbsdeutschland.com/loesungen/vertragsanalyse; }
location ^~ /loesungen  { return 301 https://sbsdeutschland.com/plattform/flowcheck; }

# ---- Application entry points ----------------------------------------------
# These belong to the running invoice application and must keep working. They
# are redirected rather than proxied, so the marketing layer never sits in front
# of an authenticated flow.
location = /login    { return 301 https://app.sbsdeutschland.com/login; }
location = /demo     { return 301 https://app.sbsdeutschland.com/demo; }
location = /copilot  { return 301 https://app.sbsdeutschland.com/copilot; }
location ^~ /mbr/    { return 301 https://app.sbsdeutschland.com$request_uri; }
location = /docs     { return 301 https://app.sbsdeutschland.com/docs; }
location = /openapi.json { return 301 https://app.sbsdeutschland.com/openapi.json; }
