# Shared proxy directives for the sbs-web upstream.
# The Host header must be preserved: the application selects the site from it.
proxy_pass         http://sbs_web_upstream;
proxy_http_version 1.1;
proxy_set_header   Host              $host;
proxy_set_header   X-Real-IP         $remote_addr;
proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
proxy_set_header   X-Forwarded-Proto $scheme;
proxy_set_header   X-Forwarded-Host  $host;
proxy_set_header   Upgrade           $http_upgrade;
proxy_set_header   Connection        $sbs_connection_upgrade;
proxy_read_timeout 30s;
proxy_buffering    on;
